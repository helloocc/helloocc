name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'
  push:
    branches: [main, master]
    paths:
      - cache/requirements.txt
      - src/updateGithubStats.py
      - src/updateSnapshot.py
      - src/snapshot_metrics.py
      - templates/snapshot/**
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Test snapshot scope
        run: python -m unittest discover -s tests -v
      - name: Generate profile cards
        env:
          USER_NAME: ${{ github.repository_owner }}
          ACCESS_TOKEN: ${{ github.token }}
          PROFILE_OS: ${{ vars.PROFILE_OS }}
        run: python src/updateGithubStats.py
      - name: Generate GitHub Snapshot
        env:
          USER_NAME: ${{ github.repository_owner }}
          ACCESS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.STATS_TOKEN != '' }}
        run: python src/updateSnapshot.py
      - name: Commit profile cards
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add img/github_stats_dark.svg img/github_stats_light.svg img/snapshot
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
