<svg width="360" height="250" viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 11px;
  line-height: 18px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #00000000;
  stroke: #8B8B8B22;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 20px;
  font-size: 14px;
  font-weight: 600;
  color: rgb(72, 148, 224);
  fill: rgb(72, 148, 224);
}

ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  min-width: 0;
  display: flex;
  font-size: 11px;
  margin-right: 0;
  min-height: 24px;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(0);
  animation-duration: 1s;
  animation-name: slideIn;
  animation-function: ease-in-out;
  animation-fill-mode: forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  flex-shrink: 0;
  width: 13px;
  height: 13px;
  fill: rgb(248, 96, 105);
  margin-right: 0.5ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #00000000;
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 12px;
}

.lang {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-right: 4px;
  font-weight: 600;
  margin-right: auto;
  color: rgb(135, 135, 135);
}

.percent {
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  color: rgb(150,150,150)
}
</style>
<g>
<rect x="5" y="5" id="background" />
<g>
<foreignObject x="21" y="17" width="318" height="216">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

<h2>Most Used Languages</h2>

<div>
<span class="progress">
<span style="background-color:#b07219;width:87.18240%;" class="progress-item"></span><span style="background-color:#f1e05a;width:5.35700%;" class="progress-item"></span><span style="background-color:#e34c26;width:3.66485%;" class="progress-item"></span><span style="background-color:#3572A5;width:1.99118%;" class="progress-item"></span><span style="background-color:#563d7c;width:1.11164%;" class="progress-item"></span><span style="background-color:#8b949e;width:0.69293%;" class="progress-item"></span>
</span>
</div>

<ul>

<li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#b07219"/></svg><span class="lang">Java</span><span class="percent">87.18%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#f1e05a"/></svg><span class="lang">JavaScript</span><span class="percent">5.36%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#e34c26"/></svg><span class="lang">HTML</span><span class="percent">3.66%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#3572A5"/></svg><span class="lang">Python</span><span class="percent">1.99%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#563d7c"/></svg><span class="lang">CSS</span><span class="percent">1.11%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#8b949e"/></svg><span class="lang">Other</span><span class="percent">0.69%</span></li>

</ul>

</div>
</foreignObject>
</g>
</g>
</svg>
