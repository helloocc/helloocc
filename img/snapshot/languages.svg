<svg width="360" height="250" viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 11px;
  line-height: 18px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #00000000;
  stroke: #8B8B8B22;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 4px;
  line-height: 20px;
  font-size: 14px;
  font-weight: 600;
  color: rgb(72, 148, 224);
  fill: rgb(72, 148, 224);
}

.method {
  margin: 0 0 12px;
  font-size: 9px;
  line-height: 14px;
  color: rgb(145, 145, 145);
}

ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  min-width: 0;
  display: flex;
  font-size: 11px;
  margin-right: 0;
  min-height: 24px;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(0);
  animation-duration: 1s;
  animation-name: slideIn;
  animation-function: ease-in-out;
  animation-fill-mode: forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  flex-shrink: 0;
  width: 13px;
  height: 13px;
  fill: rgb(248, 96, 105);
  margin-right: 0.5ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #00000000;
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 12px;
}

.lang {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-right: 4px;
  font-weight: 600;
  margin-right: auto;
  color: rgb(135, 135, 135);
}

.percent {
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  color: rgb(150,150,150)
}
</style>
<g>
<rect x="5" y="5" id="background" />
<g>
<foreignObject x="21" y="17" width="318" height="216">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

<h2>Most Used Languages</h2>
<p class="method">Top 10 share · Equal weight per repository</p>

<div>
<span class="progress">
<span style="background-color:#3178c6;width:27.47327%;" class="progress-item"></span><span style="background-color:#b07219;width:26.50658%;" class="progress-item"></span><span style="background-color:#f1e05a;width:20.56281%;" class="progress-item"></span><span style="background-color:#3572A5;width:8.88804%;" class="progress-item"></span><span style="background-color:#41b883;width:4.83713%;" class="progress-item"></span><span style="background-color:#563d7c;width:3.82734%;" class="progress-item"></span><span style="background-color:#e34c26;width:3.56298%;" class="progress-item"></span><span style="background-color:#89e051;width:1.93761%;" class="progress-item"></span><span style="background-color:#8b949e;width:1.23966%;" class="progress-item"></span><span style="background-color:#c6538c;width:1.16458%;" class="progress-item"></span>
</span>
</div>

<ul>

<li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#3178c6"/></svg><span class="lang" title="TypeScript">TypeScript</span><span class="percent">27.47%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#b07219"/></svg><span class="lang" title="Java">Java</span><span class="percent">26.51%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#f1e05a"/></svg><span class="lang" title="JavaScript">JavaScript</span><span class="percent">20.56%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#3572A5"/></svg><span class="lang" title="Python">Python</span><span class="percent">8.89%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#41b883"/></svg><span class="lang" title="Vue">Vue</span><span class="percent">4.84%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#563d7c"/></svg><span class="lang" title="CSS">CSS</span><span class="percent">3.83%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#e34c26"/></svg><span class="lang" title="HTML">HTML</span><span class="percent">3.56%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#89e051"/></svg><span class="lang" title="Shell">Shell</span><span class="percent">1.94%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#8b949e"/></svg><span class="lang" title="ASP">ASP</span><span class="percent">1.24%</span></li><li><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="octicon"><circle cx="8" cy="8" r="4" fill="#c6538c"/></svg><span class="lang" title="SCSS">SCSS</span><span class="percent">1.16%</span></li>

</ul>

</div>
</foreignObject>
</g>
</g>
</svg>
